# [CH2 Physical AI] 43강. [실습] Nav2 다중 Waypoint 주행
# 절: 3-1. 경유지 정의는 파일로
# 원본 경로: config/waypoints.yaml
# ※ 강의 교안의 코드 블록을 원문 그대로 옮긴 것(핵심부 발췌 포함)

# config/waypoints.yaml — 좌표를 코드에 박지 않는다 (모듈 ⑤ 원칙)
waypoints:
  - {name: kitchen,  x: 2.0,  y: -1.5, yaw: 1.57}
  - {name: hallway,  x: 0.5,  y:  3.0, yaw: 0.0}
  - {name: bedroom,  x: -3.2, y:  1.0, yaw: -1.57}
  - {name: dock,     x: 0.0,  y:  0.0, yaw: 0.0}
